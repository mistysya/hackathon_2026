services:
  api:
    build:
      context: .
      target: dev
    command: ["go", "run", "./cmd/api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_DSN: "file:/data/app.db?_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)"
      AGENT_MODE: "${AGENT_MODE:-auto}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_TIMEOUT: "${OPENAI_TIMEOUT:-20s}"
      OPENAI_MAX_RETRIES: "${OPENAI_MAX_RETRIES:-1}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - .:/workspace/backend
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - sqlite-data:/data

volumes:
  go-mod-cache:
  go-build-cache:
  sqlite-data:
